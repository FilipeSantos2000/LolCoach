# Builds the Windows installer and publishes it as a GitHub Release when a version tag is pushed.
# Usage: bump "version" in package.json, commit, then: git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload the installer

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check tag matches package.json version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match package.json version $version"
            exit 1
          }

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
